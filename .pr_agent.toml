# PR-Agent settings (.github/workflows/pr-agent.yml). Reference:
# https://github.com/The-PR-Agent/pr-agent/blob/main/pr_agent/settings/configuration.toml
# The review rules below are the same as .github/copilot-instructions.md; change both together.

[ignore]
glob = [
    '**/package-lock.json',
    'dashboard/public/demo/**',   # generated by scripts/demo_snapshot.py; CI checks it
    'examples/**',                # sample repositories for the language smoke tests
]

[pr_reviewer]
require_tests_review = true
require_security_review = true
require_estimate_effort_to_review = true
num_max_findings = 8
extra_instructions = """
CodeTwin AI selects regression tests, estimates the risk left by a selection and abstains when the evidence is
weak. Its behaviour is fixed by a research paper. Check these rules first (full list: AGENTS.md):
- Look-ahead: code in src/codetwin/risk/, selection.py or report/ must not use the new test run (anything only
  known after the change's tests ran). Only Engine.learn() may use it.
- Unknown is not "no dependency": unresolved links (dynamic calls, unparsed files, new modules) must be reported
  in Impact.unknowns or Decision.reasons, never dropped.
- Calibration: crc_threshold returns -1.0 when no threshold is feasible; the adaptive level is updated only after
  an outcome is known; abstain when residual risk > alpha. Report sections must not change the selection.
- No hard-coded languages or repositories: CodeTwin must work on any repository in any language. Flag new special
  cases for one language, extension, test runner or repository name in shared code; language facts belong in
  src/codetwin/lang/specs/ or .codetwin.toml.
- Output contract: top-level keys of Decision.to_dict() change only with an OUTPUT_SCHEMA bump; API answer shapes
  change together with dashboard/src/lib/api.ts.
- Layering: no analysis logic in extensions/, action/ or dashboard/; features go in the auto-discovered folders
  (commands/, mcp_tools/, report/, store/migrations/), not in cli.py, mcp_server.py, engine.py or extension.ts.
- LLM code (llm/) must not change a selection, decision, risk number or the evidence store, and never logs keys.
- External input (API bodies, uploaded reports, LLM output) is validated; files are read with encoding="utf-8";
  credentials are never sent over plain HTTP or across redirects.
- Workflows and action/: values reach shell code through env:, never ${{ ... }} inside run:.
- New behaviour needs a test; tests must not need network access. Engines and stores are closed (with Engine(...)).
Do not comment on formatting that ruff, mypy or eslint enforce.
"""

[pr_code_suggestions]
extra_instructions = """
Follow the project rules in AGENTS.md: no look-ahead in risk/ and selection.py, no hard-coded language or
repository, type hints on public functions, encoding="utf-8" for file reads. Suggest fixes, not style changes.
"""
