server {
    listen 80;
    # Relative redirects (/decisions -> /decisions/): an absolute one would name port 80 and http, not the
    # published port or the https of a proxy in front.
    absolute_redirect off;
    root /usr/share/nginx/html;
    # nginx inherits add_header only into locations that set none of their own, so /demo/ repeats them below.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # A missing page answers 404 (not the 404 page with 200), so probes and caches see broken links.
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    location /demo/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }
}
