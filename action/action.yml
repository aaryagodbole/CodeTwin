name: CodeTwin AI test selection
description: Select the tests a pull request needs, state the residual risk, and run them.
# Use in a pull_request workflow after checking out with fetch-depth: 0 and installing the project's
# own test dependencies. Every value from the event or the repository is passed through environment
# variables, never interpolated into shell code (test file names come from the pull request).
inputs:
  alpha:
    description: Target miss rate
    default: "0.10"
  run-selected:
    description: Run the selected tests after selecting them
    default: "true"
  package:
    description: pip requirement for CodeTwin (a version, a wheel URL from a release, or a local path)
    default: "codetwin"
  review:
    description: Post a review (summary comment + inline comments) to the pull request; needs pull-requests write
    default: "false"
  github-token:
    description: Token used to post the review
    default: ${{ github.token }}
  upload:
    description: >-
      Upload the decision report to CodeTwin Cloud (docs/cloud.md). Opt-in. Authenticates with the job's GitHub
      OIDC token, so the job needs `permissions: id-token: write`; no secret is needed. A failed upload only warns.
    default: "false"
  upload-server:
    description: CodeTwin Cloud API URL (https)
    default: ""
outputs:
  decision:
    description: proceed or abstain
    value: ${{ steps.select.outputs.decision }}
  residual-risk:
    description: Estimated residual risk of the selection
    value: ${{ steps.select.outputs.residual_risk }}
  sarif-file:
    description: SARIF 2.1.0 file of the review findings (when review is true), for github/codeql-action/upload-sarif
    value: ${{ steps.review.outputs.sarif }}
runs:
  using: composite
  steps:
    - name: Install CodeTwin
      shell: bash
      env:
        CODETWIN_PACKAGE: ${{ inputs.package }}
      run: python -m pip install "$CODETWIN_PACKAGE"

    - name: Record evidence on the base commit
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        [ -n "$BASE_REF" ] || { echo "::error::CodeTwin action runs on pull_request events"; exit 1; }
        git fetch --no-tags origin "refs/heads/$BASE_REF"
        git checkout -q --detach FETCH_HEAD
        [ -f .codetwin.toml ] || codetwin init
        codetwin record
        git checkout -q --detach "$HEAD_SHA"

    - name: Select tests
      id: select
      shell: bash
      env:
        ALPHA: ${{ inputs.alpha }}
      run: |
        codetwin select --alpha "$ALPHA" --json > codetwin-decision.json
        python - <<'PY'
        import json, os
        d = json.load(open("codetwin-decision.json"))
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
            s.write(f"### CodeTwin AI: {d['decision'].upper()} (estimated residual risk {d['residual_risk']:.1%})\n")
            s.writelines(f"- {r}\n" for r in d["reasons"])
            s.write(f"\n{len(d['selected'])} test files selected:\n\n")
            s.writelines(f"- `{t}`\n" for t in d["selected"])
            extras = {k: v.get("summary") for k, v in (d.get("extras") or {}).items() if isinstance(v, dict) and v.get("summary")}
            if extras:   # one line per report section: changed symbols, connected repositories, contracts, ...
                s.write("\n#### Report\n\n")
                s.writelines(f"- **{k.replace('_', ' ')}**: {v}\n" for k, v in sorted(extras.items()))
        with open(os.environ["GITHUB_OUTPUT"], "a") as o:
            o.write(f"decision={d['decision']}\nresidual_risk={d['residual_risk']}\ncount={len(d['selected'])}\n")
        PY

    - name: Review the change
      id: review
      if: inputs.review == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        python -m pip install -q "httpx>=0.27"     # GitHub API client (also in the server/llm extras)
        codetwin review --decision codetwin-decision.json --post-github --format sarif -o codetwin-review.sarif
        echo "sarif=codetwin-review.sarif" >> "$GITHUB_OUTPUT"

    - name: Upload the decision report
      if: inputs.upload == 'true'
      shell: bash
      env:
        CODETWIN_SERVER: ${{ inputs.upload-server }}
      run: codetwin push --decision codetwin-decision.json --best-effort   # never fails the job (docs/cloud.md)

    - name: Run selected tests
      if: inputs.run-selected == 'true' && steps.select.outputs.count != '0'
      shell: bash
      run: codetwin run      # the project's own test runner (pytest, jest, go test, mvn, ...)
