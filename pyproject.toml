[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "codetwin"
version = "0.1.0"
description = "Evidence-aware, risk-calibrated change verification: select the tests a change needs and state the risk left behind."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Aarya Godbole" }, { name = "Suhani Bhati" },
  { name = "Madhura Suryawanshi" }, { name = "Shreya Gole" },
]
dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "coverage>=7.6",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]   # SDK 1.x (FastMCP) and 2.x (MCPServer) both work
dev = ["ruff>=0.6", "pytest-timeout>=2.3"]

[project.scripts]
codetwin = "codetwin.cli:main"
codetwin-mcp = "codetwin.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codetwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
