[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "codetwin"
dynamic = ["version"]
description = "Evidence-aware, risk-calibrated change verification: select the tests a change needs and state the risk left behind."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CodeTwin AI contributors" }]
dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "coverage>=7.6",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]   # SDK 1.x (FastMCP) and 2.x (MCPServer) both work
server = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]   # dashboard API (codetwin.server) and LLM access
llm = ["httpx>=0.27"]          # LLM access only (codetwin.llm)
dev = ["ruff>=0.6", "pytest-timeout>=2.3", "build>=1.2", "httpx>=0.27", "mypy>=2.4.1", "types-networkx"]

[project.scripts]
codetwin = "codetwin.cli:main"
codetwin-mcp = "codetwin.mcp_server:main"

[project.urls]
Repository = "https://github.com/aaryagodbole/CodeTwin"
Changelog = "https://github.com/aaryagodbole/CodeTwin/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/codetwin/__init__.py"   # single source of the version

[tool.hatch.build]
artifacts = ["src/codetwin/server/static/**"]   # dashboard build (gitignored), added by the release workflow

[tool.hatch.build.targets.sdist]
# only what is needed to build and test the Python package (not node_modules or front-end builds)
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/codetwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["codetwin"]
branch = true

[tool.coverage.report]
fail_under = 80          # CI fails if a pull request drops total coverage below this
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, pyupgrade, bugbear, security (bandit), simplify, typing stubs
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "PYI"]
ignore = [
  "S603", "S607",   # subprocess calls run git and pytest with argument lists, never a shell
  "E501",           # long lines are left to review; line-length = 120 is the guide
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # pytest uses assert

[tool.mypy]
packages = ["codetwin"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
