[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "codetwin"
dynamic = ["version"]
description = "Evidence-aware, risk-calibrated change verification: select the tests a change needs and state the risk left behind."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CodeTwin AI contributors" }]
dependencies = [
  "networkx>=3.6.1",
  "numpy>=2.4.6",
  "scikit-learn>=1.9.1",
  "coverage>=7.17.2",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3.0"]   # SDK 1.x (FastMCP) and 2.x (MCPServer) both work
server = ["fastapi>=0.162.2", "uvicorn>=0.54.0"]   # dashboard API (codetwin.server)
dev = ["ruff>=0.17.4", "pytest-timeout>=2.4.0", "build>=1.6.1", "httpx>=0.28.1"]

[project.scripts]
codetwin = "codetwin.cli:main"
codetwin-mcp = "codetwin.mcp_server:main"

[project.urls]
Repository = "https://github.com/aaryagodbole/CodeTwin"
Changelog = "https://github.com/aaryagodbole/CodeTwin/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/codetwin/__init__.py"   # single source of the version

[tool.hatch.build]
artifacts = ["src/codetwin/server/static/**"]   # dashboard build (gitignored), added by the release workflow

[tool.hatch.build.targets.wheel]
packages = ["src/codetwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["codetwin"]
branch = true

[tool.coverage.report]
fail_under = 80          # CI fails if a pull request drops total coverage below this
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 120
target-version = "py311"
