# Gemini Code Assist on GitHub: how it reviews pull requests in this repository.
# Schema: https://docs.cloud.google.com/gemini/docs/code-review/customize-repo-review
# Review rules are in .gemini/styleguide.md (same rules as .github/copilot-instructions.md).
have_fun: false
memory_config:
  disabled: false
code_review:
  disable: false
  # Medium and above: real problems, not nits. ruff, mypy and eslint already catch style.
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    # One review when a pull request opens (not on every push); comment `/gemini review` for another one.
    code_review: true
    summary: false   # CodeRabbit already writes the summary
    help: false
    include_drafts: false
ignore_patterns:
  - "**/package-lock.json"
  - "dashboard/public/demo/**"   # generated by scripts/demo_snapshot.py; CI checks it
  - "examples/**"                 # sample repositories for the language smoke tests
