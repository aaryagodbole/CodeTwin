name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read          # CI only reads the repository

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install ruff actionlint-py shellcheck-py
      - name: Lint Python (style, bugs, security rules; see pyproject.toml)
        run: ruff check src tests scripts
      - name: Check GitHub workflow files
        run: actionlint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev,mcp,server]"
      - run: mypy

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Python dependencies (known vulnerabilities)
        run: |
          python -m venv /tmp/a && /tmp/a/bin/python -m pip install -q --upgrade pip
          /tmp/a/bin/pip install -q ".[mcp,server]" pip-audit
          /tmp/a/bin/pip-audit
      - name: VS Code extension dependencies
        working-directory: extensions/vscode
        run: npm audit --omit=dev --audit-level=high
      - name: Dashboard dependencies
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,mcp,server]"
      - name: Tests with coverage (fails below the threshold in pyproject.toml)
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml
      - name: Coverage summary
        if: always() && matrix.python-version == '3.12'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          r = ET.parse("coverage.xml").getroot()
          print(f"### Coverage: {float(r.get('line-rate')) * 100:.1f}% lines, {float(r.get('branch-rate')) * 100:.1f}% branches")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml

  languages:
    # Every feature (init, record, select, impact, graph, weakcheck, run, explain, learn, no-op detection) on a
    # sample repository per language, with that language's real toolchain: CodeTwin must work on any repository.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [python, javascript, typescript, go, java, csharp, rust, ruby, php, cpp, lua, mixed]
    env:
      EXAMPLE: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install ".[languages]"
      - uses: actions/setup-node@v7
        if: contains(fromJSON('["javascript", "typescript", "mixed"]'), matrix.example)
        with: { node-version: "22" }
      - uses: actions/setup-go@v5
        if: matrix.example == 'go'
        with: { go-version: "stable" }
      - uses: actions/setup-java@v4
        if: matrix.example == 'java'
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-dotnet@v4
        if: matrix.example == 'csharp'
        with: { dotnet-version: "8.0.x" }
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.example == 'rust'
        with: { components: llvm-tools-preview }
      - uses: taiki-e/install-action@v2
        if: matrix.example == 'rust'
        with: { tool: cargo-llvm-cov }
      - uses: ruby/setup-ruby@v1
        if: matrix.example == 'ruby'
        with: { ruby-version: "3.3" }
      - uses: shivammathur/setup-php@v2
        if: matrix.example == 'php'
        with: { php-version: "8.3", coverage: pcov, tools: composer }
      - name: gcovr for C/C++ coverage
        if: matrix.example == 'cpp'
        run: pip install gcovr
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: Run every feature on examples/${{ matrix.example }}
        run: python scripts/language_smoke.py "examples/$EXAMPLE"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install build
      - run: python -m build
      - name: Install the built wheel in a clean environment and run it
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/codetwin --version
          /tmp/v/bin/codetwin --help
      - name: Smoke test on this repository (record, change, select --json)
        run: |
          for whl in dist/*.whl; do /tmp/v/bin/pip install "${whl}[mcp]"; done
          git config --global user.email ci@example.com && git config --global user.name ci
          /tmp/v/bin/codetwin record
          echo "# smoke" >> src/codetwin/selection.py
          /tmp/v/bin/codetwin select --json > decision.json
          python - <<'PY'
          import json
          d = json.load(open("decision.json"))
          assert d["schema"] == 1, d
          assert {"decision", "residual_risk", "selected", "reasons", "extras"} <= set(d), d
          assert "src/codetwin/selection.py" in d["extras"]["changed_files"]["files"], d
          print("smoke OK:", d["decision"], f"{d['residual_risk']:.1%}", len(d["selected"]), "tests")
          PY
          /tmp/v/bin/python -c "from codetwin.mcp_server import build_server; build_server('.')"
      - uses: actions/upload-artifact@v7
        with: { name: python-dist, path: dist/ }

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: extensions/vscode/package-lock.json }
      - run: npm ci
      - run: npm run compile
      - run: npx --yes @vscode/vsce package --out codetwin.vsix
      - uses: actions/upload-artifact@v7
        with: { name: vscode-extension, path: extensions/vscode/codetwin.vsix }

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with: { name: dashboard, path: dashboard/out }

  cloud:
    # The cloud API (cloud/, its own Vercel project) against a real Postgres, including the contract test that
    # compares its response shapes with the local API (docs/cloud.md).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: cloud
    env:
      CODETWIN_TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]" mypy
      - run: ruff check .
      - run: mypy --ignore-missing-imports codetwin_cloud
      - run: python -m pytest -q
      - name: The Vercel entry point imports and serves the API docs
        run: python -c "from fastapi.testclient import TestClient; import app; assert TestClient(app.app).get('/api/docs').status_code == 200"

  self-host:
    # The self-hosted stack (compose.yaml) end to end: build the images, start Postgres + API + dashboard, register
    # a project, upload a real decision with `codetwin push`, and read it back (docs/self-hosting.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: Health of every service
        run: |
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"database":"ok"'
          curl -fsS http://127.0.0.1:3000/ | grep -q "CodeTwin"
      - name: Register a project and upload a real decision
        run: |
          token=$(docker compose exec -T api python -m codetwin_cloud add-project acme/shop --public --token \
                  | grep -o 'ctp_[A-Za-z0-9_-]*')
          cp -r examples/python "$RUNNER_TEMP/shop" && cd "$RUNNER_TEMP/shop"
          git init -q && git add -A && git -c user.email=ci@example.com -c user.name=ci commit -qm example
          codetwin init && codetwin record
          sed -i 's/return a \* b/return a * b * 1/' src/shop/calc.py
          codetwin select --json > decision.json
          codetwin push --decision decision.json --repository acme/shop --server http://localhost:8080 --token "$token"
          curl -fsS http://127.0.0.1:8080/api/v1/projects/acme/shop/decisions \
            | python -c "import json, sys; rows = json.load(sys.stdin); assert len(rows) == 1, rows; print(rows[0]['decision'])"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()

  dashboard-demo:
    # The hosted dashboard (Vercel) is built in demo mode from the snapshot committed in dashboard/public/demo.
    # This job checks exactly that build: the committed snapshot is what the current engine and API produce, and
    # the build answers every request the pages make. If a PR breaks it, the deployment would break too
    # (docs/dashboard.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: pip install -e ".[server]" pytest
      - name: Demo build of the committed snapshot (what Vercel deploys)
        working-directory: dashboard
        run: npm ci && npm run build:demo
      - name: The build answers every request the dashboard makes
        working-directory: dashboard
        run: node ../scripts/check_demo_build.mjs
      - name: The committed snapshot is up to date with the engine and API
        run: |
          python scripts/demo_snapshot.py
          if ! git diff --exit-code --stat -- dashboard/public/demo/api || [ -n "$(git status --porcelain -- dashboard/public/demo/api)" ]; then
            echo "::error::dashboard/public/demo is stale: run 'python scripts/demo_snapshot.py' and commit the result"
            exit 1
          fi

  action:
    # Runs this repository's own GitHub Action on the pull request, installing CodeTwin from the checkout.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - uses: ./action
        with:
          package: ".[mcp]"
          run-selected: "false"

  windows:
    # The team develops on Windows: run the whole definition of done there too (in Git Bash).
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: python -m pip install --upgrade pip && pip install -e ".[dev,mcp,server]"
      - name: Extension and dashboard dependencies
        run: |
          (cd extensions/vscode && npm ci)
          (cd dashboard && npm ci)
      - run: bash scripts/check.sh
      - name: Smoke test of the commands in the README
        run: |
          codetwin record
          echo "# try" >> src/codetwin/selection.py
          codetwin select
          codetwin graph src/codetwin/selection.py
          git checkout src/codetwin/selection.py
