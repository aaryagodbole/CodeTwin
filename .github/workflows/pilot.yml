name: CodeTwin pilot study

# Runs the data collection for the paper on GitHub's runners.
# Triggered by a push to the pilot-data branch, or manually from the Actions tab.
on:
  push:
    branches: [pilot-data]
    paths: ["pilot/**", ".github/workflows/pilot.yml"]
  workflow_dispatch:
    inputs:
      commits:
        description: "Commits per project"
        default: "40"

permissions:
  contents: write

# a newer push cancels the run that is still going
concurrency:
  group: pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        project: [click, marshmallow, toolz, itsdangerous, dateutil]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tooling
        run: pip install "pytest>=8,<9" pytest-cov "coverage>=7.6" hypothesis freezegun simplejson pytz six attrs
      - name: Collect evidence (${{ matrix.project }})
        working-directory: pilot
        run: |
          set -o pipefail
          mkdir -p data/${{ matrix.project }}
          python collect.py --project ${{ matrix.project }} --commits ${{ github.event.inputs.commits || '40' }} 2>&1 | tee collect.log
          cp collect.log data/${{ matrix.project }}/collect.log
      - name: Package data
        if: always()
        working-directory: pilot
        run: tar --exclude='_work' -czf data_${{ matrix.project }}.tar.gz data/${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data_${{ matrix.project }}
          path: pilot/data_${{ matrix.project }}.tar.gz

  analyze:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scikit-learn matplotlib
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Unpack data
        run: |
          mkdir -p pilot
          for f in artifacts/*/*.tar.gz; do tar -xzf "$f" -C pilot; done
          ls pilot/data
      - name: Analyse
        id: analyse
        continue-on-error: true
        working-directory: pilot
        run: |
          set -o pipefail
          python analyze.py 2>&1 | tee analyze.log
      - name: Publish data and results to the pilot-results branch
        if: always()
        run: |
          mkdir -p out/data out/results
          cp artifacts/*/*.tar.gz out/data/ || true
          cp -r pilot/results/. out/results/ || true
          cp pilot/analyze.log out/ || true
          echo "analyze step: ${{ steps.analyse.outcome }}" > out/STATUS.txt
          cd out
          git init -q -b pilot-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Data and results of the CodeTwin pilot study. Run: ${{ github.run_id }} (commit ${{ github.sha }})" > README.md
          git add -A
          git commit -q -m "Pilot data and results (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pilot-results
