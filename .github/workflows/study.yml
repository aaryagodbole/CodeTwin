name: CodeTwin study v2

# Collects the data for the paper on GitHub's runners and publishes data + results to the
# study-v2-results branch. Triggered by a push to study-v2 (pilot/** or this file) or manually.
on:
  push:
    branches: [study-v2]
    paths: ["pilot/**", ".github/workflows/study.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: study-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - {project: click,        shard: 0, of: 6}
          - {project: click,        shard: 1, of: 6}
          - {project: click,        shard: 2, of: 6}
          - {project: click,        shard: 3, of: 6}
          - {project: click,        shard: 4, of: 6}
          - {project: click,        shard: 5, of: 6}
          - {project: marshmallow,  shard: 0, of: 4}
          - {project: marshmallow,  shard: 1, of: 4}
          - {project: marshmallow,  shard: 2, of: 4}
          - {project: marshmallow,  shard: 3, of: 4}
          - {project: toolz,        shard: 0, of: 3}
          - {project: toolz,        shard: 1, of: 3}
          - {project: toolz,        shard: 2, of: 3}
          - {project: itsdangerous, shard: 0, of: 3}
          - {project: itsdangerous, shard: 1, of: 3}
          - {project: itsdangerous, shard: 2, of: 3}
          - {project: dateutil,     shard: 0, of: 8}
          - {project: dateutil,     shard: 1, of: 8}
          - {project: dateutil,     shard: 2, of: 8}
          - {project: dateutil,     shard: 3, of: 8}
          - {project: dateutil,     shard: 4, of: 8}
          - {project: dateutil,     shard: 5, of: 8}
          - {project: dateutil,     shard: 6, of: 8}
          - {project: dateutil,     shard: 7, of: 8}
          - {project: loguru,  shard: 0, of: 8, pairs: true}
          - {project: loguru,  shard: 1, of: 8, pairs: true}
          - {project: loguru,  shard: 2, of: 8, pairs: true}
          - {project: loguru,  shard: 3, of: 8, pairs: true}
          - {project: loguru,  shard: 4, of: 8, pairs: true}
          - {project: loguru,  shard: 5, of: 8, pairs: true}
          - {project: loguru,  shard: 6, of: 8, pairs: true}
          - {project: loguru,  shard: 7, of: 8, pairs: true}
          - {project: pvlib,   shard: 0, of: 10, pairs: true}
          - {project: pvlib,   shard: 1, of: 10, pairs: true}
          - {project: pvlib,   shard: 2, of: 10, pairs: true}
          - {project: pvlib,   shard: 3, of: 10, pairs: true}
          - {project: pvlib,   shard: 4, of: 10, pairs: true}
          - {project: pvlib,   shard: 5, of: 10, pairs: true}
          - {project: pvlib,   shard: 6, of: 10, pairs: true}
          - {project: pvlib,   shard: 7, of: 10, pairs: true}
          - {project: pvlib,   shard: 8, of: 10, pairs: true}
          - {project: pvlib,   shard: 9, of: 10, pairs: true}
          - {project: seaborn, shard: 0, of: 10, pairs: true}
          - {project: seaborn, shard: 1, of: 10, pairs: true}
          - {project: seaborn, shard: 2, of: 10, pairs: true}
          - {project: seaborn, shard: 3, of: 10, pairs: true}
          - {project: seaborn, shard: 4, of: 10, pairs: true}
          - {project: seaborn, shard: 5, of: 10, pairs: true}
          - {project: seaborn, shard: 6, of: 10, pairs: true}
          - {project: seaborn, shard: 7, of: 10, pairs: true}
          - {project: seaborn, shard: 8, of: 10, pairs: true}
          - {project: seaborn, shard: 9, of: 10, pairs: true}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tooling
        run: pip install "pytest>=8,<9" pytest-cov "coverage>=7.6" hypothesis freezegun simplejson pytz six attrs pytest-timeout
      - name: Collect (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.of }})
        working-directory: pilot
        run: |
          set -o pipefail
          ARGS="--project ${{ matrix.project }} --shard ${{ matrix.shard }}/${{ matrix.of }} --commits 250"
          if [ "${{ matrix.pairs }}" = "true" ]; then ARGS="$ARGS --pairs namerts/gt_${{ matrix.project }}.json"; fi
          python collect.py $ARGS 2>&1 | tee collect.log
          mkdir -p data/${{ matrix.project }}/logs
          cp collect.log data/${{ matrix.project }}/logs/collect_${{ matrix.shard }}.log
      - name: Package data
        if: always()
        working-directory: pilot
        run: tar --exclude='_work' -czf data_${{ matrix.project }}_${{ matrix.shard }}.tar.gz data/${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data_${{ matrix.project }}_${{ matrix.shard }}
          path: pilot/data_${{ matrix.project }}_${{ matrix.shard }}.tar.gz

  analyze:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scikit-learn scipy matplotlib
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Unpack data
        run: |
          for f in artifacts/*/*.tar.gz; do tar -xzf "$f" -C pilot; done
          ls pilot/data; du -sh pilot/data/*
      - name: Analyse
        id: analyse
        continue-on-error: true
        working-directory: pilot
        run: |
          set -o pipefail
          python analyze.py 2>&1 | tee analyze.log
      - name: Publish data and results to the study-v2-results branch
        if: always()
        run: |
          mkdir -p out/data out/results
          for p in pilot/data/*/; do n=$(basename $p); tar -czf out/data/data_$n.tar.gz -C pilot data/$n; done
          cp -r pilot/results/. out/results/ || true
          cp pilot/analyze.log out/ || true
          echo "analyze step: ${{ steps.analyse.outcome }}" > out/STATUS.txt
          cd out
          git init -q -b study-v2-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Data and results of the CodeTwin study v2. Run: ${{ github.run_id }} (commit ${{ github.sha }})" > README.md
          git add -A
          git commit -q -m "Study v2 data and results (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" study-v2-results
