name: Release

# How to release: update CHANGELOG.md and the version in src/codetwin/__init__.py and
# extensions/vscode/package.json on dev, merge dev into main, then push a tag vX.Y.Z on main.
#
# Always: GitHub Release with the Python package (dashboard bundled), the VS Code extension (.vsix) and notes.
# Optional, once configured (see docs/releasing.md):
#   VS Code Marketplace  -> repository secret VSCE_PAT
#   Open VSX             -> repository secret OVSX_PAT
#   PyPI                 -> repository variable PUBLISH_PYPI=true and a PyPI trusted publisher for this workflow
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Check that the tag matches every version
        id: version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/codetwin/__init__.py').read())[1])")
          e=$(node -p "require('./extensions/vscode/package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] && [ "v$e" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, python $v, extension $e"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Tests
        run: pip install -e ".[dev,mcp,server]" && python -m pytest
      - name: Build dashboard and bundle it into the Python package
        working-directory: dashboard
        run: |
          npm ci && npm run build
          rm -rf ../src/codetwin/server/static && cp -r out ../src/codetwin/server/static
      - name: Build Python package
        run: python -m build
      - name: Build VS Code extension
        working-directory: extensions/vscode
        run: npm ci && npm run compile && npx --yes @vscode/vsce package --out "../../dist/codetwin-${GITHUB_REF_NAME#v}.vsix"
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - name: Release notes from CHANGELOG.md
        run: |
          python3 - <<'PY' > notes.md
          import os, re
          v = os.environ["GITHUB_REF_NAME"][1:]
          text = open("CHANGELOG.md").read()
          m = re.search(rf"## \[{re.escape(v)}\][^\n]*\n(.*?)(?=\n## \[|\n\[Unreleased\]:|\Z)", text, re.S)
          print(m[1].strip() if m else f"Release {v}")
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in v0.*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "CodeTwin AI $GITHUB_REF_NAME" --notes-file notes.md $pre

  vscode-marketplace:
    needs: build
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - name: VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --pre-release --packagePath dist/*.vsix
      - name: Open VSX (Cursor, Windsurf, VSCodium)
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish dist/*.vsix --pre-release -p "$OVSX_PAT"
      - name: Not configured
        if: env.VSCE_PAT == '' && env.OVSX_PAT == ''
        run: echo "::notice::Marketplace publishing skipped (no VSCE_PAT / OVSX_PAT secrets). See docs/releasing.md."

  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing; no token stored in the repository
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - run: rm -f dist/*.vsix
      - uses: pypa/gh-action-pypi-publish@release/v1
