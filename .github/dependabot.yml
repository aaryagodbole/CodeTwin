# Dependency updates into dev, monthly. Minor and patch updates are grouped into one pull request per
# ecosystem; each major update gets its own pull request, so one breaking upgrade does not block the rest.
# Security updates are opened as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: monthly }
    target-branch: dev
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/extensions/vscode"
    schedule: { interval: monthly }
    target-branch: dev
    ignore:
      # must match engines.vscode in package.json; raise both together by hand
      - dependency-name: "@types/vscode"
      # must match the Node.js major that VS Code ships
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      vscode-extension:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/dashboard"
    schedule: { interval: monthly }
    target-branch: dev
    ignore:
      # must match the Node.js major used in CI (22)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dashboard:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    target-branch: dev
    groups:
      github-actions:
        patterns: ["*"]
